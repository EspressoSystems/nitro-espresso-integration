name: Espresso Regression test CI

on:
  workflow_run:
    workflows: ["Espresso Docker build CI"]
    types: [completed]

  workflow_dispatch:
    inputs:
      image:
          type: choice
          default: dev
          required: true
          description: "Image to use for the regression test"
          options:
              - dev # build from source
              - custom # use custom image
      custom_image: # please make sure this image is compatible with the nitro-testnode submodule
          type: string
          required: false
          description: "Custom image to use for the regression test"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Output variables
    runs-on: ubuntu-latest
    steps:
      - name: Output variables
        run: |
          echo "github.event_name=${{ github.event_name }}"
          echo "github.event.workflow_run.ref=${{ github.event.workflow_run.ref }}"
          echo "github.event.workflow_run.head_branch=${{ github.event.workflow_run.head_branch }}"

  throughtput:
    name: Throughput test
    runs-on: ubuntu-24.04-8core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CI
        uses: ./.github/actions/ci-setup

      - name: Build
        run: make build build-replay-env -j

      - name: Transaction Streamer regression test
        run: |
          bash scripts/run-transaction-streamer-regression-ci-tests


  nitro-testnode:
    name: Espresso Regression test
    runs-on: ubuntu-24.04-8core
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'v'))
    steps:
      - name: Setup environment variables
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG_NAME=${{ github.event.workflow_run.head_branch }}
            echo "ESPRESSO_VERSION=ghcr.io/espressosystems/nitro-espresso-integration/nitro-node:$TAG_NAME" >> $GITHUB_ENV
          elif [ "${{ github.event.workflow_dispatch.inputs.image }}" = "custom" ]; then
            echo "ESPRESSO_VERSION=${{ github.event.workflow_dispatch.inputs.custom_image }}" >> $GITHUB_ENV
          else
            echo "ESPRESSO_DEV=true" >> $GITHUB_ENV
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "16"

      - name: Install wscat
        run: npm install -g wscat

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - uses: docker/build-push-action@v5
        with:
          context: ./nitro-testnode/rollupcreator
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Use default branch from test-node.bash
          build-args: |
            NITRO_CONTRACTS_BRANCH=develop

      - uses: docker/build-push-action@v5
        with:
          context: ./nitro-testnode/scripts
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v5
        with:
          context: ./nitro-testnode/mock-sequencer
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v5
        with:
          context: ./nitro-testnode/tokenbridge
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Use default branch from test-node.bash
          build-args: |
            TOKEN_BRIDGE_BRANCH=v1.2.2

      - name: Run regression test
        run: |
          echo "ESPRESSO_VERSION=${{ env.ESPRESSO_VERSION }}"
          echo "ESPRESSO_DEV=${{ env.ESPRESSO_DEV }}"
          if [ -z "$ESPRESSO_VERSION" ] && [ -z "$ESPRESSO_DEV" ]; then
            echo "Neither ESPRESSO_VERSION nor ESPRESSO_DEV is set. Exiting."
            exit 1
          fi
          cd nitro-testnode
          ./regression-test.bash

      - name: Dump docker logs on failure
        if: failure()
        run: |
          docker compose logs
