---
name: Nitro CI Setup
description: Common setup for Nitro CI jobs

runs:
  using: composite

  steps:
    - uses: cargo-bins/cargo-binstall@main
    - name: Make more disk space available on public runner
      run: |
        cargo binstall -y --force --version 2.2.0 rmz

        echo "Available storage before:"
        sudo df -h
        echo

        sudo mv ~/.cargo/bin/rmz /usr/local/bin/rmz

        sudo rmz -f $AGENT_TOOLSDIRECTORY
        sudo rmz -f /opt/az
        sudo rmz -f /opt/ghc
        sudo rmz -f /opt/google
        sudo rmz -f /opt/microsoft
        sudo rmz -f /opt/pipx
        sudo rmz -f /usr/lib/mono
        sudo rmz -f /usr/local/julia*
        sudo rmz -f /usr/local/lib/android
        sudo rmz -f /usr/local/share/boost
        sudo rmz -f /usr/local/share/chromium
        sudo rmz -f /usr/local/share/powershell
        sudo rmz -f /usr/share/az_*
        sudo rmz -f /usr/share/dotnet
        sudo rmz -f /usr/share/gradle-*
        sudo rmz -f /usr/share/swift

        echo "Available storage after:"
        sudo df -h
        echo
      shell: bash

    - name: Install dependencies
      run: sudo apt update && sudo apt install -y wabt gotestsum
      shell: bash

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: "18"
        cache: "yarn"
        cache-dependency-path: "**/yarn.lock"

    - name: Install go
      uses: actions/setup-go@v5
      with:
        go-version: 1.23.x

    - name: Install wasm-ld
      run: |
        sudo apt-get update && sudo apt-get install -y lld-14
        sudo ln -s /usr/bin/wasm-ld-14 /usr/local/bin/wasm-ld
      shell: bash

    - name: Install rust stable
      uses: dtolnay/rust-toolchain@stable
      id: install-rust
      with:
        toolchain: "1.84.1"
        targets: "wasm32-wasip1, wasm32-unknown-unknown"
        components: "llvm-tools-preview, rustfmt, clippy"

    - name: Install rust nightly
      uses: dtolnay/rust-toolchain@nightly
      id: install-rust-nightly
      with:
        toolchain: "nightly-2025-02-14"
        targets: "wasm32-wasip1, wasm32-unknown-unknown"
        components: "rust-src, rustfmt, clippy"

    - name: Set STYLUS_NIGHTLY_VER environment variable
      run: echo "STYLUS_NIGHTLY_VER=+$(rustup toolchain list | grep '^nightly' | head -n1 | cut -d' ' -f1)" >> "$GITHUB_ENV"
      shell: bash

    - name: Setup Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        cache: false
        version: v1.0.0

    - name: Install cbindgen
      run: cargo install --force cbindgen
      shell: bash

    - name: Cache Go build
      uses: actions/cache@v4
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

    - name: Cache Rust build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/
          arbitrator/target/
          arbitrator/wasm-libraries/target/
          arbitrator/wasm-libraries/soft-float/
          target/etc/initial-machine-cache/
          /home/runner/.rustup/toolchains/
        key: ${{ runner.os }}-cargo-${{ steps.install-rust.outputs.version }}-${{ hashFiles('arbitrator/Cargo.lock') }}

    - name: Cache cbrotli
      id: cache-cbrotli
      uses: actions/cache@v4
      with:
        path: |
          target/include/brotli/
          target/lib-wasm/
          target/lib/libbrotlicommon-static.a
          target/lib/libbrotlienc-static.a
          target/lib/libbrotlidec-static.a
        key: ${{ runner.os }}-brotli-${{ hashFiles('scripts/build-brotli.sh') }}

    - name: Build cbrotli-local
      if: steps.cache-cbrotli.outputs.cache-hit != 'true'
      run: ./scripts/build-brotli.sh -l
      shell: bash

    - name: Build cbrotli-wasm in docker
      if: steps.cache-cbrotli.outputs.cache-hit != 'true'
      run: ./scripts/build-brotli.sh -w -d
      shell: bash
