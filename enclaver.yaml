version: v1
name: "batcher"
target: "enclave-batcher:latest"
sources:
  app: "aws-nitro-poster:latest"
defaults:
  memory_mb: 8192
  cpu_count: 4
egress:
  allow:
    - query.*.*.espresso.network
    - "**.amazonaws.com"
    - arbitrum-sepolia.testnet.espresso.network
    - 172.31.13.254 # Parent instance private ip
ingress:
  - listen_port: 8547