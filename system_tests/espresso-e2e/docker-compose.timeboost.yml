services:
  node0:
    image: ghcr.io/espressosystems/timeboost:contract3
    command:
      [
        "/app/timeboost",
        "--config", "/app/node_0.toml",
        "--https-only", "false"
      ]
    environment:
      - RUST_LOG=timeboost=warn,sailfish=error,cliquenet=error,robusta=debug
    ports:
      - "8000:8000"
      - "8004:8004"
      - "8003:8003"
      - "8200:8200"
      - "8100:8100"
    volumes:
      - ./node_0.toml:/app/node_0.toml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nitro-timeboost
  node1:
    image: ghcr.io/espressosystems/timeboost:contract3
    command:
      [
        "/app/timeboost",
        "--config", "/app/node_1.toml",
        "--https-only", "false"
      ]
    environment:
      - RUST_LOG=timeboost=warn,sailfish=error,cliquenet=error,robusta=debug
    ports:
      - "8010:8010"
      - "8014:8014"
      - "8013:8013"
      - "8210:8210"
      - "8110:8110"
    volumes:
      - ./node_1.toml:/app/node_1.toml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nitro-timeboost
  espresso-dev-node:
    image: ghcr.io/espressosystems/espresso-sequencer/espresso-dev-node:20250910-patch1
    ports:
      - "$ESPRESSO_SEQUENCER_API_PORT:$ESPRESSO_SEQUENCER_API_PORT"
      - "$ESPRESSO_BUILDER_PORT:$ESPRESSO_BUILDER_PORT"
      - "$ESPRESSO_DEV_NODE_PORT:$ESPRESSO_DEV_NODE_PORT"
    environment:
      - ESPRESSO_BUILDER_PORT
      - ESPRESSO_DEPLOYER_ACCOUNT_INDEX
      - ESPRESSO_DEV_NODE_PORT
      - ESPRESSO_SEQUENCER_API_PORT
      - ESPRESSO_SEQUENCER_ETH_MNEMONIC
      - ESPRESSO_SEQUENCER_L1_PROVIDER
      - ESPRESSO_SEQUENCER_DATABASE_MAX_CONNECTIONS=25
      - ESPRESSO_DEV_NODE_EPOCH_HEIGHT
      - ESPRESSO_SEQUENCER_STORAGE_PATH=/data/espresso
      - RUST_LOG=WARN
      - RUST_LOG_FORMAT
      - ESPRESSO_DEV_NODE_VERSION=0.4
    volumes:
      - espresso_storage:/data/espresso
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nitro-timeboost
volumes:
  espresso_storage:
networks:
  nitro-timeboost:
    driver: bridge
    name: nitro-timeboost